    <path class="db" style="fill:none" d="M52 100 A44 14 0 0 0 140 100 M52 134 A44 14 0 0 0 140 134"/>
    <circle class="lens" cx="138" cy="150" r="26"/>
    <path class="handle" d="M157 169 L176 188"/>
  </g>

  <text class="mono name" x="136" y="100">mssql-readonly-mcp</text>
  <text class="lead" x="136" y="154">An MCP server that lets an AI assistant</text>

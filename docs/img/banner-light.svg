<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">mssql-readonly-mcp</title>
  <desc id="desc">Title image: a database cylinder with a magnifying glass, the name mssql-readonly-mcp, and the sentence: An MCP server that lets an AI assistant read one on-premises SQL Server database.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .name{font-size:50px;font-weight:700}
    .lead{font-size:32px}
    .mut{fill:#59636e}
    .panel{fill:#f6f8fa;stroke:#d0d7de;stroke-width:2}
    .db{fill:#ddf4ff;stroke:#0969da;stroke-width:5;stroke-linejoin:round}
    .lens{fill:#f6f8fa;stroke:#1f2328;stroke-width:6}
    .handle{fill:none;stroke:#1f2328;stroke-width:10;stroke-linecap:round}
  </style>

  <rect class="panel" x="1" y="1" width="958" height="238" rx="16"/>

